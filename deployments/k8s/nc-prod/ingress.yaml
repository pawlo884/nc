# Traefik Ingress — zamiast nginx-router + blue-green
# NPM: Forward nc.sowa.ch -> IP serwera k3s (port 80/443 Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nc-web
  namespace: nc-prod
  labels:
    app: nc-web
spec:
  ingressClassName: traefik
  rules:
    - host: nc.sowa.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nc-web
                port:
                  number: 8000
---
# IngressRoute — pewny routing Traefik (entrypoint web = NodePort 30080)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nc-web
  namespace: nc-prod
  labels:
    app: nc-web
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nc.sowa.ch`)
      kind: Rule
      services:
        - name: nc-web
          port: 8000
