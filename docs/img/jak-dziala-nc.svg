<svg id="nc-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" role="img" aria-labelledby="nc-flow-t nc-flow-d" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="nc-flow-t">Jak działa NC</title>
<desc id="nc-flow-d">Dane z trzech hurtowni (A, B, C) trafiają do osobnych baz PostgreSQL, są mapowane do wspólnego katalogu MPD, uzupełniane przez agenta AI i publikowane jako feedy XML, do PrestaShop, panelu React i serwera MCP. Całość napędza Celery z Redisem, uruchomione w Docker Compose na VPS.</desc>
<style>
#nc-flow{--ink:#18222f;--mute:#5b6878;--line:#c9d1db;--card:#ffffff;--soft:#eef2f6;--acc:#1f5fd1;--acc-soft:#e3ecfb;--ai:#b4570f;--ai-soft:#fbeedd;--flow:#1f5fd1}
@media (prefers-color-scheme:dark){#nc-flow{--ink:#e6ebf2;--mute:#9aa7b7;--line:#3a4656;--card:#1b2330;--soft:#151c27;--acc:#7aa5f5;--acc-soft:#1d2c48;--ai:#f0a35e;--ai-soft:#3a2816;--flow:#7aa5f5}}
:root[data-theme="dark"] #nc-flow{--ink:#e6ebf2;--mute:#9aa7b7;--line:#3a4656;--card:#1b2330;--soft:#151c27;--acc:#7aa5f5;--acc-soft:#1d2c48;--ai:#f0a35e;--ai-soft:#3a2816;--flow:#7aa5f5}
#nc-flow .box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
#nc-flow .db{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
#nc-flow .hub{fill:var(--acc-soft);stroke:var(--acc);stroke-width:2}
#nc-flow .aib{fill:var(--ai-soft);stroke:var(--ai);stroke-width:1.5}
#nc-flow .band{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
#nc-flow .h{fill:var(--ink);font-weight:600;font-size:17px}
#nc-flow .s{fill:var(--mute);font-size:13px}
#nc-flow .m{fill:var(--mute);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.04em}
#nc-flow .col{fill:var(--mute);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;letter-spacing:.12em}
#nc-flow .big{fill:var(--acc);font-family:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;font-weight:700;font-size:40px}
#nc-flow .li{fill:var(--ink);font-size:14.5px}
#nc-flow .ai{fill:var(--ai)}
#nc-flow .wire{fill:none;stroke:var(--line);stroke-width:2}
#nc-flow .pulse{fill:none;stroke:var(--flow);stroke-width:2.5;stroke-dasharray:6 14;animation:ncflow 1.6s linear infinite}
#nc-flow .pulse.ai{stroke:var(--ai)}
#nc-flow .tick{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:3 5}
#nc-flow .dot{fill:var(--acc)}
#nc-flow .arrowhead{fill:var(--flow)}
#nc-flow .arrowhead-ai{fill:var(--ai)}
@keyframes ncflow{to{stroke-dashoffset:-40}}
@media (prefers-reduced-motion:reduce){#nc-flow .pulse{animation:none;stroke-dasharray:none;opacity:.55}}
</style>
<defs>
<marker id="nc-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="nc-arr-ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-ai" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>

<!-- column headers: real sequence of the pipeline -->
<text class="col" x="20" y="62">1 · HURTOWNIE</text>
<text class="col" x="310" y="62">2 · IMPORT</text>
<text class="col" x="600" y="62">3 · WSPÓLNY KATALOG</text>
<text class="col" x="940" y="62">4 · PUBLIKACJA</text>

<!-- wires: sources -> import DBs -->
<g>
<path class="wire" d="M230 142 H310"/><path class="pulse" d="M230 142 H306" marker-end="url(#nc-arr)"/>
<path class="wire" d="M230 252 H310"/><path class="pulse" d="M230 252 H306" marker-end="url(#nc-arr)"/>
<path class="wire" d="M230 362 H310"/><path class="pulse" d="M230 362 H306" marker-end="url(#nc-arr)"/>
</g>
<!-- import DBs -> MPD -->
<g>
<path class="wire" d="M500 142 H600"/><path class="pulse" d="M500 142 H596" marker-end="url(#nc-arr)"/>
<path class="wire" d="M500 252 H600"/><path class="pulse" d="M500 252 H596" marker-end="url(#nc-arr)"/>
<path class="wire" d="M500 362 H600"/><path class="pulse" d="M500 362 H596" marker-end="url(#nc-arr)"/>
<text class="m" x="550" y="200" text-anchor="middle">mapowanie</text>
<text class="m" x="550" y="216" text-anchor="middle">(saga)</text>
</g>
<!-- MPD -> outputs -->
<g>
<path class="wire" d="M840 252 C890 252 890 134 940 134"/><path class="pulse" d="M840 252 C890 252 890 134 936 134" marker-end="url(#nc-arr)"/>
<path class="wire" d="M840 252 C890 252 890 214 940 214"/><path class="pulse" d="M840 252 C890 252 890 214 936 214" marker-end="url(#nc-arr)"/>
<path class="wire" d="M840 252 C890 252 890 294 940 294"/><path class="pulse" d="M840 252 C890 252 890 294 936 294" marker-end="url(#nc-arr)"/>
<path class="wire" d="M840 252 C890 252 890 374 940 374"/><path class="pulse" d="M840 252 C890 252 890 374 936 374" marker-end="url(#nc-arr)"/>
<circle class="dot" cx="840" cy="252" r="5"/>
</g>
<!-- AI agent -> MPD -->
<path class="wire" d="M720 452 V408"/><path class="pulse ai" d="M720 452 V412" marker-end="url(#nc-arr-ai)"/>
<!-- scheduler ticks -->
<path class="tick" d="M405 550 V404"/>
<path class="tick" d="M125 550 V404"/>
<text class="m" x="415" y="478">uruchamia wg</text>
<text class="m" x="415" y="494">harmonogramu:</text>
<text class="m" x="415" y="510">import, stany, ceny</text>

<!-- 1: wholesalers -->
<rect class="box" x="20" y="100" width="210" height="84" rx="10"/>
<text class="h" x="38" y="134">Hurtownia A</text><text class="m" x="38" y="160">REST API</text>
<rect class="box" x="20" y="210" width="210" height="84" rx="10"/>
<text class="h" x="38" y="244">Hurtownia B</text><text class="m" x="38" y="270">REST API</text>
<rect class="box" x="20" y="320" width="210" height="84" rx="10"/>
<text class="h" x="38" y="354">Hurtownia C</text><text class="m" x="38" y="380">feed XML</text>

<!-- 2: per-source databases -->
<rect class="db" x="310" y="100" width="190" height="84" rx="10"/>
<text class="h" x="328" y="134">baza hurtowni A</text><text class="m" x="328" y="160">PostgreSQL</text>
<rect class="db" x="310" y="210" width="190" height="84" rx="10"/>
<text class="h" x="328" y="244">baza hurtowni B</text><text class="m" x="328" y="270">PostgreSQL</text>
<rect class="db" x="310" y="320" width="190" height="84" rx="10"/>
<text class="h" x="328" y="354">baza hurtowni C</text><text class="m" x="328" y="380">PostgreSQL</text>

<!-- 3: MPD hub -->
<rect class="hub" x="600" y="100" width="240" height="304" rx="14"/>
<text class="big" x="622" y="152">MPD</text>
<text class="s" x="622" y="176">katalog wszystkich hurtowni</text>
<g class="li">
<text x="622" y="222">• produkty i warianty</text>
<text x="622" y="252">• stany i ceny na bieżąco</text>
<text x="622" y="282">• kody EAN i rozmiary</text>
<text x="622" y="312">• atrybuty i kategorie</text>
<text x="622" y="342">• zestawy produktów</text>
</g>
<text class="m" x="622" y="384">PostgreSQL · REST API</text>

<!-- AI agent -->
<rect class="aib" x="600" y="452" width="240" height="72" rx="10"/>
<text class="h ai" x="618" y="482">Agent AI</text>
<text class="s" x="618" y="506">LLM uzupełnia karty produktów</text>

<!-- 4: outputs -->
<rect class="box" x="940" y="100" width="280" height="68" rx="10"/>
<text class="h" x="958" y="128">Feedy XML dla sklepu</text><text class="m" x="958" y="152">format IOF · IdoSell</text>
<rect class="box" x="940" y="180" width="280" height="68" rx="10"/>
<text class="h" x="958" y="208">Sklep PrestaShop</text><text class="m" x="958" y="232">eksport przez API</text>
<rect class="box" x="940" y="260" width="280" height="68" rx="10"/>
<text class="h" x="958" y="288">Panel zarządzania</text><text class="m" x="958" y="312">React 19 · TypeScript</text>
<rect class="box" x="940" y="340" width="280" height="68" rx="10"/>
<text class="h" x="958" y="368">Asystenci AI (MCP)</text><text class="m" x="958" y="392">katalog tylko do odczytu</text>

<!-- engine + infra band -->
<rect class="band" x="20" y="550" width="560" height="84" rx="10"/>
<text class="h" x="38" y="584">Silnik zadań w tle</text>
<text class="s" x="38" y="610">Celery (kolejki fast i heavy) · Redis · harmonogram beat · Flower</text>
<rect class="band" x="600" y="550" width="620" height="84" rx="10"/>
<text class="h" x="618" y="584">Infrastruktura</text>
<text class="s" x="618" y="610">Docker Compose na VPS · nginx · deploy i wydania przez GitHub Actions</text>
</svg>
