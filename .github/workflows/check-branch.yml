name: Check Branch

# Tylko PR do main — bez push (koniec duplikatów push + pull_request)
on:
  pull_request:
    branches:
      - main

concurrency:
  group: check-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Wykryj zmienione ścieżki
    runs-on: ubuntu-latest
    outputs:
      django: ${{ steps.filter.outputs.django }}
      code_quality: ${{ steps.filter.outputs.code_quality }}
      frontend_mpd: ${{ steps.filter.outputs.frontend_mpd }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout kod
        uses: actions/checkout@v7

      - name: Filtr ścieżek względem plików w PR
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Na pull_request: lista plików z API GitHub (diff vs base PR)
          filters: |
            ci:
              - '.github/workflows/check-branch.yml'
            django:
              - 'src/**'
              - '**/requirements*.txt'
              - 'requirements*.txt'
            code_quality:
              - '**/*.{js,jsx,ts,tsx,css,scss}'
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.prettierrc'
              - '.prettierrc.*'
              - '.prettierignore'
              - 'eslint.config.*'
              - '.eslintrc*'
            frontend_mpd:
              - 'frontend/mpd/**'

  check-merge-conflicts:
    name: Sprawdź konflikty z main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sprawdź konflikty merge z main
        run: |
          echo "🔄 Sprawdzam czy branch można zmergować z main..."
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin main:main 2>&1 || {
            echo "⚠️ Nie można pobrać main jako lokalny branch, używam origin/main..."
            git fetch origin main 2>&1 || exit 1
          }

          CURRENT_HEAD=$(git rev-parse HEAD)
          MAIN_HEAD=$(git rev-parse main 2>/dev/null || git rev-parse origin/main)

          set +e
          git merge --no-commit --no-ff $MAIN_HEAD > /tmp/merge_output.txt 2>&1
          MERGE_EXIT=$?
          set -e

          if [ $MERGE_EXIT -eq 0 ]; then
            echo "✅ Brak konfliktów merge z main!"
            git reset --hard "$CURRENT_HEAD"
          else
            echo "❌ Wykryto konflikty merge z main!"
            echo "Branch nie może być zmergowany z main bez konfliktów."
            if [ -f .git/MERGE_HEAD ]; then
              echo "Konfliktujące pliki:"
              git ls-files -u | cut -f 2 | sort -u || echo "Nie można określić plików"
              git merge --abort
            else
              echo "Merge nie został rozpoczęty, resetuję do HEAD"
              git reset --hard "$CURRENT_HEAD"
            fi
            exit 1
          fi

  check-django:
    name: Sprawdź Django (składnia + migracje + testy)
    needs: changes
    if: needs.changes.outputs.django == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Wszystkie aliasy baz → jeden Postgres. W testach dev.py zeruje routery
      # i mirroruje wszystko do 'default', więc powstaje jedna testowa baza.
      DEFAULT_DB_NAME: test_db
      DEFAULT_DB_USER: postgres
      DEFAULT_DB_PASSWORD: postgres
      DEFAULT_DB_HOST: localhost
      DEFAULT_DB_PORT: '5432'
      MPD_DB_NAME: test_db
      MPD_DB_USER: postgres
      MPD_DB_PASSWORD: postgres
      MPD_DB_HOST: localhost
      MPD_DB_PORT: '5432'
      MATTERHORN1_DB_NAME: test_db
      MATTERHORN1_DB_USER: postgres
      MATTERHORN1_DB_PASSWORD: postgres
      MATTERHORN1_DB_HOST: localhost
      MATTERHORN1_DB_PORT: '5432'
      WEB_AGENT_DB_NAME: test_db
      WEB_AGENT_DB_USER: postgres
      WEB_AGENT_DB_PASSWORD: postgres
      WEB_AGENT_DB_HOST: localhost
      WEB_AGENT_DB_PORT: '5432'
      TABU_DB_NAME: test_db
      TABU_DB_USER: postgres
      TABU_DB_PASSWORD: postgres
      TABU_DB_HOST: localhost
      TABU_DB_PORT: '5432'
      MADA_DB_NAME: test_db
      MADA_DB_USER: postgres
      MADA_DB_PASSWORD: postgres
      MADA_DB_HOST: localhost
      MADA_DB_PORT: '5432'
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DJANGO_SETTINGS_MODULE: core.settings.dev
      # Dummy klucz — web_agent AIProcessor wymaga go w __init__, ale klient OpenAI
      # nie robi żadnego I/O przy konstrukcji; testy helperów nie wołają API.
      OPENAI_API_KEY: test-dummy-key-ci
      # MinIO ENDPOINT/KEY nieustawione → defs_db w trybie no-storage (upload/DELETE
      # pomijane, DEFAULT_FILE_STORAGE lokalny). Sam PUBLIC_URL wystarcza do
      # generowania linków — potrzebny w testach eksportu XML.
      MINIO_PUBLIC_URL: https://ci-bucket.example.invalid

    steps:
      - name: Checkout kod
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/requirements.ci.txt

      - name: compileall (szybka weryfikacja składni)
        run: |
          python -m compileall -q src
          echo "✅ Składnia OK"

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.ci.txt

      - name: Migracje bez luk (makemigrations --check)
        working-directory: src
        run: |
          python manage.py makemigrations --check --dry-run || {
            echo "❌ Modele rozjeżdżają się z migracjami — uruchom: python manage.py makemigrations"
            exit 1
          }
          echo "✅ Migracje spójne z modelami"

      - name: Testy (pytest)
        # Konfiguracja w pyproject.toml [tool.pytest.ini_options]:
        # DJANGO_SETTINGS_MODULE, pythonpath, python_files=tests*.py
        # (pomija management/commands/test_*_connection.py), testpaths=src/apps.
        run: >-
          pytest
          --cov=src/apps --cov-report=term-missing:skip-covered

  check-code-quality:
    name: Sprawdź jakość kodu (linting i formatowanie)
    needs: changes
    if: needs.changes.outputs.code_quality == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            # Bez husky w CI (prepare → husky)
            HUSKY=0 npm ci
          fi

      - name: Audyt zależności (informacyjnie)
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || true
            npm outdated || true
          fi

      - name: Sprawdź formatowanie Prettier (tylko kod JS/TS/CSS, bez JSON i markdown)
        run: |
          if [ -f package.json ]; then
            echo "🎨 Sprawdzam formatowanie Prettier (tylko pliki kodu JS/TS/CSS)..."
            set +e
            PRETTIER_OUTPUT=$(npx prettier --check "**/*.{js,jsx,ts,tsx,css,scss}" --ignore-path .gitignore 2>&1)
            PRETTIER_EXIT=$?
            set -e

            if echo "$PRETTIER_OUTPUT" | grep -q "No files matching the pattern were found"; then
              echo "ℹ️ Brak plików JS/TS/CSS do sprawdzenia"
              echo "✅ Formatowanie pominięte - brak plików do sprawdzenia"
            elif [ $PRETTIER_EXIT -ne 0 ]; then
              echo "$PRETTIER_OUTPUT"
              echo "❌ Formatowanie nie jest poprawne!"
              echo "Uruchom: npx prettier --write \"**/*.{js,jsx,ts,tsx,css,scss}\""
              exit 1
            else
              echo "$PRETTIER_OUTPUT"
              echo "✅ Formatowanie kodu poprawne!"
            fi
          else
            echo "ℹ️ Brak package.json, pomijam sprawdzenie formatowania"
          fi

      - name: Sprawdź linting ESLint
        run: |
          if [ -f package.json ]; then
            echo "🔍 Sprawdzam linting ESLint..."
            set +e
            LINT_OUTPUT=$(npm run lint 2>&1)
            LINT_EXIT=$?
            set -e

            if echo "$LINT_OUTPUT" | grep -q "No files matching"; then
              echo "ℹ️ Brak plików JS/TS do sprawdzenia"
              echo "✅ Linting pominięty - brak plików do sprawdzenia"
            elif [ $LINT_EXIT -ne 0 ]; then
              echo "$LINT_OUTPUT"
              echo "❌ Linting wykrył błędy!"
              echo "Uruchom: npm run lint:fix"
              exit 1
            else
              echo "$LINT_OUTPUT"
              echo "✅ Linting przeszedł!"
            fi
          else
            echo "ℹ️ Brak package.json, pomijam sprawdzenie lintingu"
          fi

  check-mpd-frontend:
    name: Sprawdź MPD React (tsc + vite build)
    needs: changes
    if: needs.changes.outputs.frontend_mpd == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mpd

    steps:
      - name: Checkout kod
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/mpd/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/mpd/package-lock.json

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Audyt zależności (informacyjnie)
        continue-on-error: true
        run: |
          npm audit --audit-level=high || true
          npm outdated || true

      - name: Build (tsc -b && vite build)
        run: npm run build

  summary:
    name: Podsumowanie
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        check-merge-conflicts,
        check-django,
        check-code-quality,
        check-mpd-frontend,
      ]
    if: always()

    steps:
      - name: Podsumowanie sprawdzeń
        run: |
          echo "📊 Podsumowanie sprawdzeń brancha:"
          echo "🔎 django=${{ needs.changes.outputs.django }} code_quality=${{ needs.changes.outputs.code_quality }} frontend_mpd=${{ needs.changes.outputs.frontend_mpd }} ci=${{ needs.changes.outputs.ci }}"
          echo "• konflikty: ${{ needs.check-merge-conflicts.result }}"
          echo "• Django: ${{ needs.check-django.result }}"
          echo "• jakość kodu: ${{ needs.check-code-quality.result }}"
          echo "• MPD React: ${{ needs.check-mpd-frontend.result }}"

          check_ok() {
            local name="$1"
            local result="$2"
            if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              return 0
            fi
            echo "❌ $name nie przeszło ($result)"
            return 1
          }

          FAILED=0
          check_ok "konflikty" "${{ needs.check-merge-conflicts.result }}" || FAILED=1
          check_ok "Django" "${{ needs.check-django.result }}" || FAILED=1
          check_ok "jakość kodu" "${{ needs.check-code-quality.result }}" || FAILED=1
          check_ok "MPD React" "${{ needs.check-mpd-frontend.result }}" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ Niektóre sprawdzenia nie przeszły!"
            exit 1
          fi

          echo "✅ Wszystkie wymagane sprawdzenia OK (skipped = celowo pominięte)."
